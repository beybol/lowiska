# flare-skill.conf — ogranicza globalny skill `flare-project` do tego repozytorium.
# Wymienia identyfikatory projektów Flare, których wolno dotykać z poziomu tego repo.
# Usunięcie pliku = rezygnacja ze scope'owania. Plik nie zawiera sekretów
# (identyfikatory projektów nie są danymi wrażliwymi — klucz API żyje w `.env`).

group = Łowiska

# Jedna linia na środowisko, w sekcji [projects]:
#   <project_id> = <etykieta-env> ; <nazwa projektu we Flare> ; <stage>
# PIERWSZA linia to środowisko PODSTAWOWE (odpytywane najpierw, domyślne).
[projects]
93111 = local ; Łowiska ; development

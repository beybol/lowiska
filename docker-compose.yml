# Jedyny plik opisujący lokalne środowisko deweloperskie — bez nakładek.
#
# Porty hosta są przesunięte o +3000 względem portów kontenerów, żeby środowisko
# mogło chodzić równocześnie z WorkSnapem (+1000) i PunktymiSzczepień (+2000).
#
# ⚠️ Usługi app/queue/scheduler NIE dostają zmiennych DB_* ani env_file — to
# druga z pięciu warstw izolacji pakietu testów (patrz docs/operations/docker.md).
# Zmienne z listy environment: trafiają do $_SERVER i wygrywają z deklaracjami
# z phpunit.xml, więc każda z nich tutaj przebiłaby wymuszenie bazy testowej.

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "11000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  # Serwer zasobów z przeładowaniem na żywo. NIE startuje przy zwykłym
  # `docker compose up` — uruchamia się profilem:
  #   docker compose --profile vite up -d vite
  #
  # Potrzebny wyłącznie przy edytowaniu CSS-a i JavaScriptu; bez niego Laravel
  # serwuje zasoby zbudowane z `public/build`. Powód jest wydajnościowy:
  # obserwator odpytuje pliki przez most Windows↔Linux (powiązanie katalogu nie
  # przekazuje zdarzeń systemu plików) i zjadał przez to ~44% rdzenia bez przerwy.
  #
  # ⚠️ Po zatrzymaniu usługi sprawdź, czy zniknął plik `public/hot`. Jeśli został,
  # Laravel dalej szuka serwera zasobów i strona zostanie bez stylów.
  vite:
    profiles: ["vite"]
    build:
      context: .
      target: dev
    ports:
      - "8173:8173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      # tailwind.config.js skanuje vendor/laravel/framework/**/Pagination/**,
      # więc katalog musi tu być — tylko do odczytu, bo Vite go nie zapisuje.
      - vendor:/var/www/html/vendor:ro
    command: sh -c "npm install && npm run dev"

  queue:
    build:
      context: .
      target: dev
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    depends_on:
      mysql:
        condition: service_healthy

  # Nie startuje przy zwykłym `docker compose up` — uruchamia się profilem:
  #   docker compose --profile scheduler up -d scheduler
  #
  # Powód jest wydajnościowy: pętla budzi się co 60 s i za każdym razem stawia
  # cały framework, a start kosztuje sekundy odczytów przez most Windows↔Linux.
  # W codziennej pracy rzadko jest potrzebna.
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      target: dev
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    command: >
      sh -c "while true; do
        php artisan schedule:run;
        sleep 60;
      done"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "6306:3306"
    environment:
      MYSQL_DATABASE: lowiska
      MYSQL_USER: lowiska
      MYSQL_PASSWORD: lowiska
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulowiska", "-plowiska"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11025:8025"
      - "4025:1025"

volumes:
  dbdata:
  vendor:
  node_modules:

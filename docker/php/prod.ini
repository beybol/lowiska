; Ustawienia PHP dla celu `prod` (FrankenPHP na Cloud Run).

memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0

; Kod jest wpieczony w obraz i nie zmienia się w trakcie życia instancji, więc
; sprawdzanie znaczników czasu byłoby czystym kosztem przy każdym żądaniu.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

upload_max_filesize = 32M
post_max_size = 32M

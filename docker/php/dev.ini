; Ustawienia PHP dla celu `dev`.

memory_limit = 1G

; `artisan serve` działa na interfejsie wiersza poleceń, więc bez enable_cli
; OPcache w ogóle nie obejmowałby serwowanej aplikacji.
opcache.enable = 1
opcache.enable_cli = 1

; Kod leży na powiązaniu z dyskiem Windows, gdzie pojedynczy `stat` kosztuje
; ~9 ms. Znaczniki czasu muszą być sprawdzane (inaczej zmiana w kodzie nie byłaby
; widoczna bez restartu), ale NIE przy każdym żądaniu.
;
; ⚠️ Nie ustawiaj revalidate_freq = 0. Zmierzone na tym projekcie: przy freq = 0
; żądanie do /admin trwało ~4 s, przy freq = 2 — ~0,03 s. Ceną są do dwóch sekund
; opóźnienia, zanim zmiana w pliku stanie się widoczna.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Laravel + dwa panele Filamenta to znacznie więcej niż domyślne 10 000 plików
; i 128 MB — po przekroczeniu limitu OPcache przestaje cokolwiek przyspieszać.
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

upload_max_filesize = 32M
post_max_size = 32M
